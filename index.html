<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DANA UI FIX</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f1f3f6;
}

/* SPLASH */
.splash {
  position: fixed;
  width: 100%;
  height: 100%;
  background: #118acb;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  color: white;
}
.logo { font-size: 40px; font-weight: bold; }
.loader {
  margin-top: 20px;
  width: 40px; height: 40px;
  border: 4px solid rgba(255,255,255,0.3);
  border-top: 4px solid white;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg);} }

/* APP */
.app {
  max-width: 400px;
  margin: auto;
  overflow: hidden;
}

/* SLIDER FIX */
.wrapper {
  display: flex;
  transition: transform 0.4s ease;
}

.screen {
  min-width: 100%;
  padding: 20px;
  box-sizing: border-box;
}

/* HEADER */
.header {
  background: #118acb;
  color: white;
  padding: 20px;
  border-radius: 0 0 20px 20px;
}

/* CARD */
.card {
  background: white;
  border-radius: 16px;
  padding: 15px;
  margin-top: -20px;
}
.option {
  border: 2px solid #eee;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 10px;
}

/* BUTTON */
.btn {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: #118acb;
  color: white;
  font-size: 16px;
  margin-top: 20px;
}

/* INPUT */
.input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ddd;
}

/* PIN */
.pin {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}
.pin input {
  width: 45px;
  height: 50px;
  text-align: center;
  font-size: 20px;
  border-radius: 10px;
  border: 1px solid #ddd;
}

/* OTP */
.sheet {
  position: fixed;
  bottom: -100%;
  left: 0;
  width: 100%;
  background: white;
  border-radius: 20px 20px 0 0;
  padding: 20px;
  transition: 0.4s;
  text-align: center;
}
.sheet.active { bottom: 0; }
.small { color: #666; margin-top: 10px; }
</style>
</head>

<body>

<!-- SPLASH -->
<div class="splash" id="splash">
  <div class="logo">DANA</div>
  <div class="loader"></div>
</div>

<div class="app" id="app" style="display:none;">

  <div class="wrapper" id="wrap">

    <!-- SCREEN 1 -->
    <div class="screen">
      <div class="header"><h3>Pilih Kebutuhan</h3></div>
      <div class="card">
        <div class="option">Aktifkan Dana Paylater</div>
        <div class="option">Aktifkan Dana Cicil</div>
        <div class="option">Laporkan Kendala</div>
      </div>
      <button id="btn1" class="btn">Konfirmasi</button>
    </div>

    <!-- SCREEN 2 -->
    <div class="screen">
      <input id="phone" class="input" placeholder="+62 812xxxx">
      <button id="btn2" class="btn" disabled>Lanjut</button>
    </div>

    <!-- SCREEN 3 -->
    <div class="screen">
      <div class="pin" id="pin">
        <input maxlength="1"><input maxlength="1"><input maxlength="1">
        <input maxlength="1"><input maxlength="1"><input maxlength="1">
      </div>
      <button id="btn3" class="btn">Verifikasi</button>
    </div>

  </div>
</div>

<!-- OTP -->
<div class="sheet" id="otp">
  <h3>Masukkan OTP</h3>
  <div class="pin">
    <input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1">
  </div>
  <div class="small" id="timer">Kirim ulang (60s)</div>
</div>

<script>
// SPLASH
setTimeout(()=>{
  document.getElementById("splash").style.display="none";
  document.getElementById("app").style.display="block";
},1500);

// SLIDE FIX
const wrap = document.getElementById("wrap");

// NAVIGASI
document.getElementById("btn1").onclick = ()=>{
  wrap.style.transform = "translateX(-100%)";
};

document.getElementById("btn2").onclick = ()=>{
  wrap.style.transform = "translateX(-200%)";
};

// VALIDASI HP
const phone = document.getElementById("phone");
const btn2 = document.getElementById("btn2");

phone.addEventListener("input", ()=>{
  let v = phone.value.replace(/\\D/g,'');
  if(!v.startsWith('62')) v='62'+v;
  phone.value = '+'+v;
  btn2.disabled = v.length < 10;
});

// PIN AUTO
const pins = document.querySelectorAll("#pin input");

pins.forEach((el,i)=>{
  el.addEventListener("input", ()=>{
    if(el.value && i<5) pins[i+1].focus();
  });
});

// OTP SHOW
document.getElementById("btn3").onclick = ()=>{
  document.getElementById("otp").classList.add("active");
};

// TIMER
let t=60;
setInterval(()=>{
  if(t>0){
    t--;
    document.getElementById("timer").innerText = `Kirim ulang (${t}s)`;
  }
},1000);
</script>

</body>
</html>
